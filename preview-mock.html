<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Store Tasks — filters + copy (feature mock)</title>
<!--
  Standalone MOCK of the Store Tasks widget's admin controls:
    • compact STORE dropdown (was a row of pills)
    • filter bar: keyword search, RECURRENCE (all/one-off/recurring),
      PRIORITY (all/high/med/low), status (open/done)
    • per-task COPY button → copies "installationId/taskId"
  Mirrors the real widget logic (renderStoreTabs dropdown + filteredTasks()).
-->
<style>
  :root{--primary:#0EA5E9;--primary-rgb:14,165,233;--primary-text:#fff;--success:#2E7D4A;--error:#C41E3A;
    --dark:#1A1A1A;--gray:#6b7280;--gray-lt:#9ca3af;--border:#e5e7eb;--r-sm:6px;--r-md:10px;--r-lg:14px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#f4f5f7;color:var(--dark);padding:22px;line-height:1.45;}
  .wrap{max-width:600px;margin:0 auto;background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);
    box-shadow:0 1px 3px rgba(0,0,0,.05);padding:18px;}
  .header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .title{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .title .dot{width:9px;height:9px;border-radius:50%;background:var(--primary);}
  .badge-count{margin-left:2px;font-size:12px;font-weight:700;color:var(--gray-lt);background:#f3f4f6;padding:2px 9px;border-radius:999px;}
  .badge-mock{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--primary);padding:3px 8px;border-radius:999px;}
  /* store dropdown */
  .store-tabs{display:flex;margin-bottom:12px;}
  .store-drop{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 10px 0 11px;border:1.5px solid var(--border);border-radius:var(--r-md);background:#fff;}
  .store-drop-ic{color:var(--gray-lt);display:flex;flex-shrink:0;}
  .store-select{border:none;background:none;font-family:inherit;font-size:13px;font-weight:700;color:var(--dark);cursor:pointer;outline:none;max-width:240px;}
  /* filter bar */
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;}
  .idsearch{flex:1 1 150px;min-width:120px;height:34px;padding:0 12px;border:1.5px solid var(--border);border-radius:var(--r-md);background:#fafafa;font-family:inherit;font-size:13px;color:var(--dark);}
  .idsearch:focus{outline:none;border-color:var(--primary);background:#fff;}
  .fsel{height:34px;padding:0 10px;border:1.5px solid var(--border);border-radius:var(--r-md);background:#fff;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--gray);cursor:pointer;outline:none;}
  .fsel:focus,.store-select:focus{border-color:var(--primary);}
  .status-toggle{display:flex;border:1.5px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:#fff;}
  .status-opt{padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;color:var(--gray);font-family:inherit;border:none;background:none;transition:all .15s;}
  .status-opt.active{background:var(--primary);color:#fff;}
  /* list */
  .list{display:flex;flex-direction:column;gap:8px;}
  .card{position:relative;display:flex;gap:12px;padding:12px 13px;background:#fff;border:1px solid var(--border);border-radius:var(--r-md);box-shadow:0 1px 3px rgba(0,0,0,.05);transition:box-shadow .15s;}
  .card:hover{box-shadow:0 4px 14px rgba(0,0,0,.09);}
  .card.done{opacity:.62;}
  .check{width:20px;height:20px;border-radius:50%;border:2px solid #d1d5db;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;}
  .check.on{background:var(--success);border-color:var(--success);}
  .check svg{display:none;}.check.on svg{display:block;}
  .body{flex:1;min-width:0;}
  .top{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:5px;}
  .b{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#fff;}
  .b-recur{background:rgba(var(--primary-rgb),.12);color:var(--primary);}
  .b-oneoff{background:#f1f5f9;color:#475569;}
  .b-prio{border:1.5px solid currentColor;color:#6b7280;}
  .b-store{background:#eef2ff;color:#4338ca;}
  .b-proof{background:rgba(217,119,6,.12);color:#B45309;}
  .ctitle{font-size:14px;font-weight:600;line-height:1.4;}
  .card.done .ctitle{text-decoration:line-through;color:var(--gray);}
  .meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:5px;font-size:11px;color:var(--gray-lt);font-weight:600;}
  .copyid{position:absolute;top:8px;right:8px;width:26px;height:26px;border:1.5px solid var(--border);border-radius:var(--r-sm);background:#fff;color:var(--gray);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s,color .15s,border-color .15s;padding:0;}
  .card:hover .copyid{opacity:1;}
  .copyid:hover{border-color:var(--primary);color:var(--primary);}
  .copyid.copied{color:var(--success);border-color:var(--success);opacity:1;}
  .empty{padding:24px;text-align:center;color:var(--gray-lt);font-size:13px;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#0f172a;color:#fff;font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.25);transition:all .25s;pointer-events:none;z-index:50;}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><div class="title"><span class="dot"></span>Store Tasks <span class="badge-count" id="count"></span></div><span class="badge-mock">feature mock</span></div>
  <div class="store-tabs">
    <label class="store-drop"><span class="store-drop-ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
      <select class="store-select" id="f-store"></select></label>
  </div>
  <div class="filters">
    <input class="idsearch" id="f-q" placeholder="Search tasks…" autocomplete="off" spellcheck="false" />
    <select class="fsel" id="f-recur"><option value="all">All tasks</option><option value="oneoff">One-off</option><option value="recurring">Recurring</option></select>
    <select class="fsel" id="f-prio"><option value="all">All priorities</option><option value="Priority_1">High priority</option><option value="Priority_2">Medium priority</option><option value="Priority_3">Low priority</option></select>
    <div class="status-toggle"><button class="status-opt active" data-s="open">Open</button><button class="status-opt" data-s="done">Done</button></div>
  </div>
  <div class="list" id="list"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const STORES=[{id:"27048",name:"Downtown"},{id:"31022",name:"Airport"}];
const CAT={compliance:"#8B4513",safety:"#D97706",storetask:"#0EA5E9",training:"#4A90A4",merchandising:"#7C3AED",inventory:"#0369A1"};
const PRI={Priority_1:"High",Priority_2:"Med",Priority_3:"Low"};
const T=[
 {id:"t01",inst:"27048",title:"Unlock and disarm the store",type:"storetask",recur:true,prio:"Priority_1",status:"OPEN"},
 {id:"t04",inst:"27048",title:"Check walk-in freezer temperature log",type:"safety",recur:true,prio:"Priority_1",status:"OPEN",proof:true},
 {id:"t06",inst:"27048",title:"Complete monthly food-safety training",type:"training",recur:false,prio:"Priority_2",status:"OPEN"},
 {id:"t08",inst:"27048",title:"Set up new seasonal end-cap display",type:"merchandising",recur:false,prio:"Priority_3",status:"OPEN"},
 {id:"t10",inst:"27048",title:"Update shelf price tags for promotions",type:"merchandising",recur:false,prio:"Priority_3",status:"CLOSED"},
 {id:"t12",inst:"27048",title:"Submit weekly compliance attestation",type:"compliance",recur:true,prio:"Priority_1",status:"OPEN"},
 {id:"t20",inst:"31022",title:"Open the airside kiosk shutters",type:"storetask",recur:true,prio:"Priority_1",status:"OPEN"},
 {id:"t21",inst:"31022",title:"Verify duty-free seal integrity",type:"compliance",recur:true,prio:"Priority_2",status:"OPEN"},
 {id:"t22",inst:"31022",title:"Restock travel-size inventory",type:"inventory",recur:false,prio:"Priority_3",status:"OPEN"},
];
const esc=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const byId=id=>document.getElementById(id);
const IC={recur:'<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>',
  copy:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  check:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'};
let store="all",recur="all",prio="all",status="open";
function initStore(){
  byId("f-store").innerHTML=`<option value="all">All stores (${T.length})</option>`+
    STORES.map(s=>{const n=T.filter(t=>t.inst===s.id).length;return `<option value="${s.id}">${esc(s.name)} — ${s.id} (${n})</option>`;}).join("");
}
function filtered(){
  const q=byId("f-q").value.trim().toLowerCase();
  return T.filter(t=>{
    if(store!=="all"&&t.inst!==store) return false;
    const done=t.status==="CLOSED";
    if(status==="open"&&done) return false;
    if(status==="done"&&!done) return false;
    if(recur==="oneoff"&&t.recur) return false;
    if(recur==="recurring"&&!t.recur) return false;
    if(prio!=="all"&&t.prio!==prio) return false;
    if(q&&!((t.title+" "+t.type).toLowerCase().includes(q))) return false;
    return true;
  });
}
function render(){
  const rows=filtered();
  byId("count").textContent=rows.length;
  const list=byId("list");
  if(!rows.length){list.innerHTML=`<div class="empty">No tasks match these filters.</div>`;return;}
  const showStore=store==="all";
  list.innerHTML=rows.map(t=>{
    const c=CAT[t.type]||"#6b7280";const done=t.status==="CLOSED";
    const sname=(STORES.find(s=>s.id===t.inst)||{}).name||t.inst;
    const m=[`<span class="b" style="background:${c}">${esc(t.type)}</span>`,
      t.recur?`<span class="b b-recur">${IC.recur} Recurring</span>`:`<span class="b b-oneoff">One-off</span>`,
      t.prio!=="Priority_3"?`<span class="b b-prio">${PRI[t.prio]}</span>`:""].filter(Boolean);
    if(t.proof) m.push(`<span class="b b-proof">📷 Proof</span>`);
    if(showStore) m.push(`<span class="b b-store">${esc(sname)}</span>`);
    return `<div class="card ${done?"done":""}"><button class="copyid" data-copy="${t.inst}/${t.id}" title="Copy task ID">${IC.copy}</button>
      <div class="check ${done?"on":""}">${IC.check}</div>
      <div class="body"><div class="top">${m.join("")}</div><div class="ctitle">${esc(t.title)}</div>
      <div class="meta"><span>Store ${esc(t.inst)}</span></div></div></div>`;
  }).join("");
  list.querySelectorAll(".copyid").forEach(b=>b.addEventListener("click",async e=>{
    e.stopPropagation();const text=b.dataset.copy;let ok=false;
    try{await navigator.clipboard.writeText(text);ok=true;}catch(_){}
    b.classList.add("copied");toast(ok?`Copied ${text}`:"Copy blocked here");setTimeout(()=>b.classList.remove("copied"),1200);
  }));
}
let tT;function toast(m){const e=byId("toast");e.textContent=m;e.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>e.classList.remove("show"),1500);}
byId("f-store").addEventListener("change",e=>{store=e.target.value;render();});
byId("f-recur").addEventListener("change",e=>{recur=e.target.value;render();});
byId("f-prio").addEventListener("change",e=>{prio=e.target.value;render();});
byId("f-q").addEventListener("input",render);
document.querySelectorAll(".status-opt").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".status-opt").forEach(x=>x.classList.remove("active"));b.classList.add("active");status=b.dataset.s;render();}));
initStore();render();
</script>
</body>
</html>
